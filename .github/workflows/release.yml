# Build the Windows + macOS installers and publish a public GitHub Release.
# Trigger: push a version tag, e.g.  npm version patch && git push --tags
# (manual run also allowed). Unsigned beta — no Apple/Win signing secrets needed.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # harmless; the cross-repo publish below uses the RELEASES_TOKEN PAT, not this built-in token

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: '--win'
          - os: macos-latest # Apple Silicon runner → arm64 .dmg (covers 2020+ Macs)
            flag: '--mac'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app bundle
        run: npm run build

      # Publishes the installers + update manifest (latest.yml) to the SEPARATE PUBLIC repo
      # koan-shdw/video-dancer. (This source repo is the PRIVATE koan-shdw/video-dancer-dev.) The
      # releases repo is public, so the installed app reads the update feed with no embedded token.
      # Cross-repo publish can't use the built-in GITHUB_TOKEN (it can only write its own repo), so
      # RELEASES_TOKEN — a PAT with Contents:write on koan-shdw/video-dancer — does the upload.
      - name: Package + publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder ${{ matrix.flag }} --publish always

      # Evergreen download buttons: every release ALSO carries stable-named copies of the
      # installers, so the README/release-notes buttons can point at
      # releases/latest/download/VideoDancer-Windows-Setup.exe | VideoDancer-Mac.dmg forever.
      # (Release-notes ritual: start each release body with the two button links — copy the
      # <p align="center"> block from the README top.)
      - name: Upload stable-named installer copy (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName 'dist/VideoDancer-Windows-Setup.exe'
          gh release upload '${{ github.ref_name }}' 'dist/VideoDancer-Windows-Setup.exe' --clobber -R koan-shdw/video-dancer

      - name: Upload stable-named installer copy (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          dmg=$(ls dist/*.dmg | head -n 1)
          cp "$dmg" 'dist/VideoDancer-Mac.dmg'
          gh release upload "${GITHUB_REF_NAME}" 'dist/VideoDancer-Mac.dmg' --clobber -R koan-shdw/video-dancer
