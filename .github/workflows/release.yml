# Build the Windows + macOS installers and publish a public GitHub Release.
# Trigger: push a version tag, e.g.  npm version patch && git push --tags
# (manual run also allowed: it packages without publishing, to check signing before a tag).
# Signing switches on by itself once the secrets below exist; without them the build stays unsigned.
#   Mac (Apple Developer ID + notarization):  MAC_CERT_P12 (base64 of the Developer ID Application .p12),
#     MAC_CERT_PASSWORD, APPLE_TEAM_ID, APPLE_API_KEY_P8 (the AuthKey .p8 file's text), APPLE_API_KEY_ID,
#     APPLE_API_ISSUER
#   Windows (SSL.com eSigner, publisher SHDW Gallery): ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: write # the publish steps upload the installers to this repo's own release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: '--win'
          - os: macos-latest # Apple Silicon runner → arm64 .dmg (covers 2020+ Macs)
            flag: '--mac'
    runs-on: ${{ matrix.os }}
    env:
      # list 59: the beta download page's bucket gets each installer once these secrets exist (beta-gate/README.md)
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_APPLE: ${{ secrets.MAC_CERT_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
      HAS_ESIGNER: ${{ secrets.ES_USERNAME != '' && secrets.ES_TOTP_SECRET != '' }}
      PACKAGE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # koan-shared ships TypeScript sources — its own devDependencies (react types) must be
      # present or the app's typecheck dies inside the package (react/jsx-runtime, field-hit)
      - name: Install @koan/shared dependencies
        run: npm ci
        working-directory: koan-shared

      # @koan/vidancer-ui (the renderer as a package, R0 2026-09-06) carries its OWN devDependencies
      # — dockview, onnxruntime-web, @koan/shared (file:../), react types — with a committed
      # lockfile. The app's typecheck includes the package's sources, so they must be installed
      # there too (v0.15.0's first fire died here: "Cannot find module 'dockview'").
      - name: Install @koan/vidancer-ui dependencies
        run: npm ci
        working-directory: koan-shared/vidancer-ui

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test && npm run test:primary-images && npm run test:jobs

      - name: Browser playback and dialog tests
        run: npm run test:playback && npm run test:dialogs && npm run test:watch-ui && npm run test:voice-ui && npm run test:editor-ui && npm run test:scrub && npm run test:transitions && npm run test:codir-queue && npm run test:image-crop && npm run test:score-ui && npm run test:take-colors

      - name: Build app bundle
        run: npm run build

      - name: Sandboxed preload smoke test
        run: npm run test:preload

      # Publishes the installers + update manifest (latest.yml) to this public repo's release, so the
      # installed app reads the update feed with no embedded token. The built-in GITHUB_TOKEN does it.
      - name: Get SSL.com CodeSignTool (Windows signing)
        if: matrix.os == 'windows-latest' && env.PACKAGE == 'true' && env.HAS_ESIGNER == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.ssl.com/download/codesigntool-for-windows/' -OutFile "$env:RUNNER_TEMP\codesigntool.zip"
          Expand-Archive "$env:RUNNER_TEMP\codesigntool.zip" "$env:RUNNER_TEMP\codesigntool"
          "CODESIGNTOOL_DIR=$env:RUNNER_TEMP\codesigntool" >> $env:GITHUB_ENV

      # Signing rides electron-builder's own steps (Mac: the .p12 + notarytool with the API key; Windows:
      # scripts/sign-win.cjs), so latest.yml hashes the signed installers. A manual run publishes nothing.
      - name: Package + publish
        if: env.PACKAGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        shell: bash
        run: |
          publish=never
          [[ "$GITHUB_REF" == refs/tags/* ]] && publish=always
          args=()
          if [ "${{ matrix.os }}" = macos-latest ] && [ "$HAS_APPLE" = true ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8" APPLE_API_KEY_ID="$APPLE_KEY_ID" APPLE_API_ISSUER="$APPLE_ISSUER"
            # package.json's identity:null keeps unsigned builds unsigned; the team ID picks the Developer ID cert
            args+=("-c.mac.identity=$APPLE_TEAM_ID" "-c.mac.notarize.teamId=$APPLE_TEAM_ID")
          fi
          if [ "${{ matrix.os }}" = windows-latest ] && [ "$HAS_ESIGNER" = true ]; then
            args+=(-c.win.sign=./scripts/sign-win.cjs -c.win.signingHashAlgorithms=sha256)
          fi
          npx electron-builder ${{ matrix.flag }} --publish "$publish" "${args[@]}"

      - name: Check the signatures
        if: env.PACKAGE == 'true' && ((matrix.os == 'macos-latest' && env.HAS_APPLE == 'true') || (matrix.os == 'windows-latest' && env.HAS_ESIGNER == 'true'))
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos-latest ]; then
            app=$(ls -d dist/mac*/*.app | head -n 1)
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app" # Gatekeeper's own verdict: "accepted, source=Notarized Developer ID"
            xcrun stapler validate "$app"
          else
            powershell -NoProfile -Command 'Get-ChildItem dist -Filter *.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "$($_.Name): $($s.Status) $($s.SignerCertificate.Subject)"; if ($s.Status -ne "Valid") { exit 1 } }'
          fi

      # Evergreen download buttons: every release ALSO carries stable-named copies of the
      # installers, so the README/release-notes buttons can point at
      # releases/latest/download/VideoDancer-Windows-Setup.exe | VideoDancer-Mac.dmg forever.
      # (Release-notes ritual: start each release body with the two button links — copy the
      # <p align="center"> block from the README top.)
      - name: Upload stable-named installer copy (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName 'dist/VideoDancer-Windows-Setup.exe'
          gh release upload '${{ github.ref_name }}' 'dist/VideoDancer-Windows-Setup.exe' --clobber -R koan-shdw/video-dancer

      - name: Upload stable-named installer copy (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls dist/*.dmg | head -n 1)
          cp "$dmg" 'dist/VideoDancer-Mac.dmg'
          gh release upload "${GITHUB_REF_NAME}" 'dist/VideoDancer-Mac.dmg' --clobber -R koan-shdw/video-dancer

      # list 59: the installer also goes to the beta download page's private bucket (Cloudflare R2), under
      # the same stable name, so the password page always hands out the newest. Skipped until the repo
      # has the CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID secrets.
      - name: Installer to the beta download page
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          file=dist/VideoDancer-Windows-Setup.exe
          [ "${{ matrix.os }}" = "macos-latest" ] && file=dist/VideoDancer-Mac.dmg
          npx --yes wrangler@4 r2 object put "vidancer-beta/$(basename "$file")" --file "$file" --remote
